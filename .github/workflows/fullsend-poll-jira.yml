# Jira poller for DEVREG (fullsend v0.57.1).
#
# Manual only until a labeled issue produces a dispatch record.
# Do not enable cron until that path is proven — the poller writes
# entity properties on every issue it scans.
#
# Preserve the issue URL compatibility fields for the harness dispatcher.
name: fullsend Jira poll

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  poll:
    runs-on: ubuntu-24.04
    concurrency:
      group: fullsend-jira-poll
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_dispatches: ${{ steps.build-matrix.outputs.has_dispatches }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fullsend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.57.1 --repo fullsend-ai/fullsend \
            -p 'fullsend_0.57.1_linux_amd64.tar.gz' -O - | tar xz
          sudo mv fullsend /usr/local/bin/
          fullsend --version

      - name: Poll Jira
        env:
          FULLSEND_JIRA_TOKEN: ${{ secrets.FULLSEND_JIRA_TOKEN || secrets.JIRA_TOKEN }}
          FULLSEND_JIRA_EMAIL: ${{ secrets.FULLSEND_JIRA_EMAIL || secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${JIRA_BASE_URL}" ]]; then
            echo "::error::JIRA_BASE_URL variable is empty (must be an Actions variable, not a secret)"
            exit 1
          fi
          # Use a job-local config for each existing Jira query. The repo's
          # generated config resumes after polling, and dispatch still uses it.
          poll_config=.fullsend/config.yaml
          poll_base=$(mktemp)
          cp "$poll_config" "$poll_base"
          trap 'cp "$poll_base" "$poll_config"; rm -f "$poll_base"' EXIT

          set_poll_config() {
            local project="$1"
            local query="$2"
            # Fullsend adds the project clause from tracker.jira.project.
            query="${query#"project = $project AND "}"
            JIRA_POLL_PROJECT="$project" JIRA_POLL_QUERY="$query" yq '
              .tracker = {"jira": {"base_url": strenv(JIRA_BASE_URL), "project": strenv(JIRA_POLL_PROJECT), "poll": {"enabled": true, "query": strenv(JIRA_POLL_QUERY)}}}
              | .authorization = (((.authorization // []) + [{"provider": "jira", "labels": "project_roles"}]) | unique_by(.provider))
            ' "$poll_base" > "$poll_config"
          }
          set_poll_config DEVREG 'project = DEVREG AND labels = "fullsend" AND statusCategory != Done ORDER BY updated DESC'
          fullsend poll \
            --input-driver jira-poll \
            --target-repo "${TARGET_REPO}" \
            --output dispatches.json \
            --fullsend-dir .fullsend
          echo "Dispatch count: $(jq 'length' dispatches.json)"
          jq -c '.[] | {agent, event_type, status_number}' dispatches.json || true

      - name: Upload dispatches.json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatches
          path: dispatches.json
          if-no-files-found: ignore

      - name: Adapt Jira payloads for harness-run
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f dispatches.json ]]; then
            echo "[]" > dispatches.json
          fi
          # Harness URL compatibility: jq '.issue.html_url // .pull_request.html_url'
          # Jira poll events already use issue.html_url = browse URL and
          # issue.number = Jira's internal id. Copy entity.url if missing.
          # Clear status_number for Jira so fullsend run does not try to
          # comment on GitHub issue 5593227 (and mint role "refine", which
          # 403s).
          jq '
            map(
              (.event_payload | if type == "string" then fromjson else . end) as $ev
              | ($ev
                  | .issue = ((.issue // {}) + {
                      html_url: (.issue.html_url // .entity.url // ""),
                      number: (.issue.number // .entity.id // 0)
                    })
                ) as $patched
              | .event_payload = ($patched | tojson)
              | if ($patched.issue.html_url | tostring | test("atlassian\\.net"))
                then .status_number = ""
                else .
                end
            )
          ' dispatches.json > dispatches.adapted.json
          mv dispatches.adapted.json dispatches.json

      - name: Build dispatch matrix
        id: build-matrix
        run: |
          set -euo pipefail
          if ! jq -e 'length > 0' dispatches.json > /dev/null 2>&1; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            echo "has_dispatches=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
          echo "has_dispatches=true" >> "${GITHUB_OUTPUT}"

  harness:
    name: Harness
    needs: poll
    if: needs.poll.outputs.has_dispatches == 'true'
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d11de3ea0dde5aa652110b6716c19e000c426df7  # v0.57.1
    with:
      matrix: ${{ needs.poll.outputs.matrix }}
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      FULLSEND_JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      FULLSEND_JIRA_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
