# Jira poller for DEVREG (fullsend v0.39.0).
#
# Manual only until a labeled issue produces a dispatch record.
# Do not enable cron until that path is proven — the poller writes
# entity properties on every issue it scans.
#
# reusable-dispatch.yml@v0.39.0 still requires issue.html_url or
# pull_request.html_url before harness-run. Jira NormalizedEvents only
# have entity.url, so we copy that onto issue.html_url before calling
# the reusable workflow (#2264 workaround).
name: fullsend Jira poll

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  packages: read
  pull-requests: write

jobs:
  poll:
    runs-on: ubuntu-24.04
    concurrency:
      group: fullsend-jira-poll
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_dispatches: ${{ steps.build-matrix.outputs.has_dispatches }}
    steps:
      - uses: actions/checkout@v4

      - name: Install fullsend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.39.0 --repo fullsend-ai/fullsend \
            -p 'fullsend_0.39.0_linux_amd64.tar.gz' -O - | tar xz
          sudo mv fullsend /usr/local/bin/
          fullsend --version

      - name: Poll Jira
        env:
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${JIRA_BASE_URL}" ]]; then
            echo "::error::JIRA_BASE_URL variable is empty (must be an Actions variable, not a secret)"
            exit 1
          fi
          fullsend poll \
            --input-driver jira-poll \
            --jira-url "${JIRA_BASE_URL}" \
            --jira-project DEVREG \
            --jql 'project = DEVREG AND labels = "fullsend" AND statusCategory != Done ORDER BY updated DESC' \
            --target-repo "${TARGET_REPO}" \
            --output dispatches.json \
            --fullsend-dir .fullsend
          echo "Dispatch count: $(jq 'length' dispatches.json)"
          jq -c '.[] | {agent, event_type, status_number}' dispatches.json || true

      - name: Upload dispatches.json
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dispatches
          path: dispatches.json
          if-no-files-found: ignore

      - name: Adapt Jira payloads for harness-run
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f dispatches.json ]]; then
            echo "[]" > dispatches.json
          fi
          # v0.39 harness-run: jq '.issue.html_url // .pull_request.html_url'
          # Jira poll events already use issue.html_url = browse URL and
          # issue.number = Jira's internal id. Copy entity.url if missing.
          # Clear status_number for Jira so fullsend run does not try to
          # comment on GitHub issue 5593227 (and mint role "refine", which
          # 403s).
          jq '
            map(
              (.event_payload | if type == "string" then fromjson else . end) as $ev
              | ($ev
                  | .issue = ((.issue // {}) + {
                      html_url: (.issue.html_url // .entity.url // ""),
                      number: (.issue.number // .entity.id // 0)
                    })
                ) as $patched
              | .event_payload = ($patched | tojson)
              | if ($patched.issue.html_url | tostring | test("atlassian\\.net"))
                then .status_number = ""
                else .
                end
            )
          ' dispatches.json > dispatches.adapted.json
          mv dispatches.adapted.json dispatches.json

      - name: Build dispatch matrix
        id: build-matrix
        run: |
          set -euo pipefail
          if ! jq -e 'length > 0' dispatches.json > /dev/null 2>&1; then
            echo "No dispatches."
            echo 'matrix={"include":[]}' >> "${GITHUB_OUTPUT}"
            echo "has_dispatches=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MATRIX=$(jq -c '{include: .}' dispatches.json)
          DELIM="MATRIX_$(openssl rand -hex 8)"
          {
            echo "matrix<<${DELIM}"
            printf '%s' "${MATRIX}"
            echo
            echo "${DELIM}"
          } >> "${GITHUB_OUTPUT}"
          echo "has_dispatches=true" >> "${GITHUB_OUTPUT}"

  harness:
    name: Harness
    needs: poll
    if: needs.poll.outputs.has_dispatches == 'true'
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@d9e8bec726f85e0cfd1aeca44252030135a5b1d1 # v0.39.0
    with:
      matrix: ${{ needs.poll.outputs.matrix }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
