schema: rhdh-spec-driven

context: |
  Domain: go-hello — a small Go HTTP service used to dogfood Fullsend.
  Tech stack: Go, net/http, Docker.
  We use conventional commits.

  This repo has no specifications/prd or specifications/adr tree.
  Canonical long-lived specs live under openspec/specs/ only when a change
  introduces an enduring capability. Otherwise Canonical Touchpoints is None.

  Change-local OpenSpec workspaces live in openspec/changes/<change-name>/.

  Fullsend /fs-code runs are one-shot. Do not pause for a human between
  artifacts. Skip journal writes; this repo does not ship openspec-journal.py.

rules:
  proposal:
    - Keep proposals under 500 words
    - Always include a Non-goals section
    - Include Canonical Touchpoints (None unless openspec/specs/ is in play)
    - State change type: product | architecture | feature-spec | migration | workflow-only | docs-only
  specs:
    - Follow the project-local rhdh-spec-driven capability spec format
    - Scenarios MUST use exactly four hashtags (#### Scenario:)
  design:
    - Keep design brief for this small service
    - If no architectural decisions are needed, say No design changes under Decisions
  tasks:
    - Checkbox tasks the apply phase can parse (- [ ] N.M ...)
    - Include tests for each behavior change (`make test`)
