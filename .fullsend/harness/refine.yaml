# Custom refine agent. Triggered by /fs-refine on a work item (Jira or GitHub).
#
# Jira: the poller emits a NormalizedEvent; this harness matches the slash
# command and the post-script writes back to the ticket. Built-in agents still
# do not post to Jira.
#
# Identity reuses the org review GitHub App (no refine mint slug).

agent: agents/refine.md
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: policies/base.yaml
readonly_repo: true

role: review
slug: fullsend-ai-review

model: opus

providers:
  - vertex-ai
  - github

skills:
  - skills/refining

host_files:
  - src: env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: env/refine.env
    dest: /sandbox/workspace/.env.d/refine.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: /tmp/workspace/issue-context.json
    dest: /sandbox/workspace/issue-context.json
    optional: true

pre_script: scripts/pre-refine.sh
post_script: scripts/post-refine.sh

timeout_minutes: 20

trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-refine"
    && event.entity.kind == "work_item"

env:
  runner:
    JIRA_TOKEN: ${JIRA_TOKEN}
    JIRA_USER_EMAIL: ${JIRA_USER_EMAIL}
    JIRA_BASE_URL: ${JIRA_BASE_URL}
    GH_TOKEN: ${GH_TOKEN}
    REVIEW_TOKEN: ${REVIEW_TOKEN}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    RUN_URL: ${RUN_URL}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}

forge:
  github:
    pre_script: scripts/pre-refine.sh
    post_script: scripts/post-refine.sh
    env:
      runner:
        GH_TOKEN: ${GH_TOKEN}
        REVIEW_TOKEN: ${REVIEW_TOKEN}
        ISSUE_NUMBER: ${ISSUE_NUMBER}
        REPO_FULL_NAME: ${REPO_FULL_NAME}
        GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
        HUMAN_INSTRUCTION: ${HUMAN_INSTRUCTION}
        RUN_URL: ${RUN_URL}
