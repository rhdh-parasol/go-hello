---
version: 1

# Sandbox policy for the refine agent (read-only planning).
#
# Inline network_policies so 0.39 overlay cannot replace the Vertex
# allowlist. **/claude does not match Claude Code 2.1+'s claude.exe.

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /proc, /dev/urandom, /app, /etc, /var/log]
  read_write: [/sandbox, /tmp, /dev/null]
landlock:
  compatibility: best_effort
process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  vertex_ai:
    name: vertex-ai
    endpoints:
      - host: "api.anthropic.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: "*.googleapis.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: "**/claude"
      # Claude Code 2.1+ ships the bun compile as claude.exe; **/claude does not match it.
      - path: "**/claude.exe"
      - path: "**/node"

  github_api:
    name: github-api
    endpoints:
      - host: "api.github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: "api.github.com"
        port: 443
        protocol: graphql
        enforcement: enforce
        access: read-only
        path: "/graphql"
      - host: "github.com"
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: "**/gh"
      - path: "**/git"
      - path: "**/node"
