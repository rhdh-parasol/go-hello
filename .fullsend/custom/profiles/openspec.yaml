---
id: openspec-cli
display_name: OpenSpec CLI
description: Local openspec / npx (telemetry disabled via openspec.env)
category: toolchain
endpoints:
  - host: registry.npmjs.org
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
    allow_encoded_slash: true
  - host: registry.yarnpkg.com
    port: 443
    protocol: rest
    access: read-only
    enforcement: enforce
binaries:
  - "**/openspec"
  - "**/npx"
  - "**/npm"
  - "**/node"
