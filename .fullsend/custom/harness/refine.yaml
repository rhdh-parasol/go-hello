# Custom refine agent. Triggered by /fs-refine on a work item (Jira or GitHub).
#
# Paths use custom/ to avoid scaffold overlay collisions (fullsend layers
# upstream defaults into top-level .fullsend dirs on every run).
#
# Jira poller event_payload is GitHub-shaped: issue.html_url is the browse URL
# (e.g. https://redhat.atlassian.net/browse/DEVREG-281), issue.number is the
# Jira numeric id — not the key. Pre/post scripts parse the key from that URL.
#
# Identity reuses the org review GitHub App (no refine mint slug).
#
# 0.39 overlay does not copy agents profiles/providers into this repo
# (PR 17 deleted the vendored copies). Local paths like
# profiles/fullsend-vertex-ai.yaml 404 at harness-load. Pin the same
# files the code agent already locks from fullsend-ai/agents.
#
# env.runner only lists host vars that reusable-dispatch actually sets.
# Referencing RUN_URL/REVIEW_TOKEN/ISSUE_NUMBER here fails validation before
# the agent starts.

agent: custom/agents/refine.md
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/policies/base.yaml#sha256=3ed634401d87a1327fffe5e266272d930321484ce8a91dfa5fe447d4f2e00470
readonly_repo: true

role: review
slug: fullsend-ai-review

# Pin 4.6 explicitly. The `opus` alias on Claude Code 2.1.x resolves to
# claude-opus-5. Opus 4.8 is not enabled on this Vertex project.
model: claude-opus-4-6

providers:
  - https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/providers/vertex-ai.yaml#sha256=ae5ebe527e5d7b0fa6994346fde3f6ba11b632a3ba78ece96591b5ed85083ec1

openshell:
  profiles:
    - https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/profiles/fullsend-vertex-ai.yaml#sha256=1bd763964e48c695aadc9219a169bafb714db10b560abef3e56157dd5d180338
    - custom/profiles/claude-exe.yaml

# URL policy/provider/profile need the harness allowlist (not inherited from
# config.yaml). Prefix must match config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/

skills:
  - custom/skills/refining

host_files:
  - src: custom/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: custom/env/refine.env
    dest: /sandbox/workspace/.env.d/refine.env
    expand: true
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true
  - src: /tmp/workspace/issue-context.json
    dest: /sandbox/workspace/issue-context.json
    optional: true

pre_script: custom/scripts/pre-refine.sh
post_script: custom/scripts/post-refine.sh

timeout_minutes: 20

trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-refine"
    && event.entity.kind == "work_item"

env:
  runner:
    JIRA_TOKEN: ${JIRA_TOKEN}
    JIRA_USER_EMAIL: ${JIRA_USER_EMAIL}
    JIRA_BASE_URL: ${JIRA_BASE_URL}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
