# grillme — general PR grilling agent (BYOA + CEL slash command).
#
# Paths use custom/ to avoid scaffold overlay collisions (fullsend layers
# upstream defaults into top-level .fullsend dirs on every run).
#
# Trigger: comment /fs-grillme on a non-fork PR. Each run is one grill
# turn; the post-script posts a PR review with inline comments, plus
# optional thread replies/resolutions.
#
# Ported from rhdh-parasol/node-api (pre-0.39 named providers + local
# network_policies). This harness follows the go-hello 0.39 refine
# pattern: URL-pin policy/provider/profile from fullsend-ai/agents.
#
# 0.39 overlay does not copy agents profiles/providers into this repo.
# Named providers (`vertex-ai`, `github`) fail harness-load. Vertex STS
# is gated by `_provider_vertex_ai`, built only from the profile whose
# id is `fullsend-vertex-ai`. agents#1117 (ba1d46fb) adds **/claude.exe
# to that profile. GitHub API (`gh pr diff` / GraphQL) uses github-ro —
# 0.39 has no `fullsend-github` profile.
#
# env.runner only lists host vars that reusable-dispatch actually sets.
# Referencing RUN_URL/REVIEW_TOKEN/ISSUE_NUMBER here fails validation
# before the agent starts. Post-script falls back GH_TOKEN for writes.

agent: custom/agents/grillme.md
image: ghcr.io/fullsend-ai/fullsend-code:latest
policy: https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/policies/base.yaml#sha256=3ed634401d87a1327fffe5e266272d930321484ce8a91dfa5fe447d4f2e00470
readonly_repo: true

role: review
slug: fullsend-ai-review

# Pin 4.6 explicitly. The `opus` alias on Claude Code 2.1.x resolves to
# claude-opus-5. Opus 4.8 is not enabled on this Vertex project.
model: claude-opus-4-6

providers:
  - https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/providers/vertex-ai.yaml#sha256=ae5ebe527e5d7b0fa6994346fde3f6ba11b632a3ba78ece96591b5ed85083ec1
  - https://raw.githubusercontent.com/fullsend-ai/agents/c4e059f9f2b8c48e13b3845992b9b774d41b5de7/providers/github-ro.yaml#sha256=f4678aa328deea8653d15691d32d9f03fc9aba92ee8383bac7f4a03993739360

openshell:
  profiles:
    - https://raw.githubusercontent.com/fullsend-ai/agents/ba1d46fb30329283a092fc30d53cf68e99e5ce86/profiles/fullsend-vertex-ai.yaml#sha256=71ea4699ec497d4b9592220adf7588019eb8445dbc77af8e0e6767e68dcb5585
    - https://raw.githubusercontent.com/fullsend-ai/agents/ba1d46fb30329283a092fc30d53cf68e99e5ce86/profiles/fullsend-github-ro.yaml#sha256=ceea92ccf7698db783d764b8680dfd683933f8b02a2c0321fbf771023efc47c6

# URL policy/provider/profile need the harness allowlist (not inherited
# from config.yaml). Prefix must match config.yaml allowed_remote_resources.
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/

skills:
  - custom/skills/grilling

host_files:
  - src: custom/env/gcp-vertex.env
    dest: /sandbox/workspace/.env.d/gcp-vertex.env
    expand: true
  - src: custom/env/grillme.env
    dest: /sandbox/workspace/.env.d/grillme.env
  - src: ${GOOGLE_APPLICATION_CREDENTIALS}
    dest: /tmp/.gcp-credentials.json
  - src: ${GCP_OIDC_TOKEN_FILE}
    dest: /sandbox/workspace/.gcp-oidc-token
    optional: true

pre_script: custom/scripts/pre-grillme.sh
post_script: custom/scripts/post-grillme.sh

timeout_minutes: 15

trigger: >
  event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-grillme"
    && event.state.change_proposal != null
    && !event.state.change_proposal.is_fork

# Top-level env provides defaults; forge.github.env supplies the same vars
# for the GitHub-specific dispatch path. Both are required because the
# harness resolves them independently (not merged).
#
# GH_TOKEN in the sandbox is the OIDC-minted role token (role: review),
# scoped to read + PR-comment permissions — not the workflow GITHUB_TOKEN.
# The agent needs it for gh pr diff / gh pr view inside the sandbox.
env:
  runner:
    GH_TOKEN: ${GH_TOKEN}
    REPO_FULL_NAME: ${REPO_FULL_NAME}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
  sandbox:
    GH_TOKEN: ${GH_TOKEN}
    GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
    REPO_FULL_NAME: ${REPO_FULL_NAME}

# pre_script / post_script are declared at the top level.
# The harness falls through to top-level scripts when forge does not
# override them — no forge-level script declarations needed.
forge:
  github:
    env:
      runner:
        GH_TOKEN: ${GH_TOKEN}
        REPO_FULL_NAME: ${REPO_FULL_NAME}
        GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
      sandbox:
        GH_TOKEN: ${GH_TOKEN}
        GITHUB_ISSUE_URL: ${GITHUB_ISSUE_URL}
        REPO_FULL_NAME: ${REPO_FULL_NAME}
