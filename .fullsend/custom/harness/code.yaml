# Overlay the stock 0.39 code agent with OpenSpec spec-then-impl.
#
# Keep post-code (push + GitHub PR). Do not add a /fs-spec command.
# Same /fs-code twice: first run writes openspec/ only (spec PR); after
# that merges, second run implements from those artifacts (impl PR).
# Jira /fs-code is matched here via CEL so the poller can dispatch; GitHub
# /fs-code stays on the built-in stage router (this trigger is Jira-only
# so the two paths do not double-fire).
#
# Skills are URL-pinned from redhat-developer/rhdh-skills (not vendored).
# Both ff-change and apply-change are listed; the agent prompt picks
# exactly one per run. Interactive skills (new-change, continue) are
# omitted — they stop mid-run. rhdh-spec-driven-schema is required by
# those skills (lives under skills/reference, not skills/refinement).
# First spec run installs the schema into openspec/ — do not vendor it.
#
# Base pin is agents#1117 (ba1d46fb): same code.yaml as c4e059f9, but
# the inherited fullsend-vertex-ai profile allows **/claude.exe.
# A sibling claude-exe profile does not extend `_provider_vertex_ai`.

base: https://raw.githubusercontent.com/fullsend-ai/agents/ba1d46fb30329283a092fc30d53cf68e99e5ce86/harness/code.yaml#sha256=4f0d9425d5ee1fa86e21d3b6d1ac9bd086da2f59de9d80a311f753c00d99303d

agent: custom/agents/code.md
model: claude-opus-4-6

skills:
  - https://github.com/redhat-developer/rhdh-skills/tree/305f8283d4774ba07fd6bbf0bbceb7a12d509380/skills/refinement/openspec-ff-change#sha256=683d4636797fa133c029f7e7b491186d9842421bf91f49bcc990239fc4ddfbe9
  - https://github.com/redhat-developer/rhdh-skills/tree/305f8283d4774ba07fd6bbf0bbceb7a12d509380/skills/refinement/openspec-apply-change#sha256=b86936803b684ea7fed4e8dc91a4ecb7713aad04a4f5ca9d948c3cda75b7c501
  - https://github.com/redhat-developer/rhdh-skills/tree/305f8283d4774ba07fd6bbf0bbceb7a12d509380/skills/reference/rhdh-spec-driven-schema#sha256=1fff2f2f5e4e6f9d89d2a8fc1bca206db825d8f7d8edebe2f3661740ceb458cd

# URL base/skills need the harness allowlist (not inherited from base
# or config.yaml). Prefixes must match config.yaml.
allowed_remote_resources:
  - https://raw.githubusercontent.com/fullsend-ai/agents/
  - https://github.com/redhat-developer/rhdh-skills/

# Do not add a sibling OpenSpec profile. OpenShell 0.0.116 rejects
# category: toolchain, and a different profile id does not extend
# `_provider_package_registries` (same lesson as claude.exe / Vertex).
# Stock fullsend-package-registries already allowlists npm/npx/node
# against registry.npmjs.org. Keep openspec.env to disable telemetry.

host_files:
  - src: custom/env/openspec.env
    dest: /sandbox/workspace/.env.d/openspec.env

# Stock code.yaml interpolates ${CODE_ALLOWED_TARGET_BRANCHES}. Built-in
# GitHub dispatch sets that host var; the Jira poller does not, so
# harness-load fails before the sandbox starts. Child env.runner merges
# over base (child keys win). Pin main — post-code allowlists it, empty
# would also fall back to the repo default.
env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: "main"

timeout_minutes: 50

trigger: >
  event.source.system == "jira"
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-code"
    && event.entity.kind == "work_item"
