# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
#
# The reusable workflow overlays upstream defaults onto the standard layered
# directories before every run. Keep repo-owned agents under custom/ so their
# harnesses and resources remain intact.
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - name: refine
      source: custom/harness/refine.yaml
      model: claude-opus-4-6
    - name: code
      source: custom/harness/code.yaml
      model: claude-opus-4-6
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - rhdh-parasol/go-hello
            - fullsend-ai/fullsend
mint_url: https://mint.fullsend.sh
inference:
    project: rhdh-sidekick-167988
    wif_provider: projects/189673402608/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-rhdh-parasol-go-hello
